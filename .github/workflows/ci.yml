name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - "docs/**"

permissions:
  contents: read

# A new push to a pull request supersedes its older runs; runs on main
# always finish, so main keeps a record of which commit broke it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # A built app or another large file must never be committed: it is
      # what a clone pays for, and removing it later means rewriting the
      # history every clone has.
      - name: Check no large file is tracked
        run: |
          big=$(git ls-files -z | while IFS= read -r -d '' f; do
            [ -f "$f" ] || continue
            s=$(wc -c <"$f")
            if [ "$s" -gt 2097152 ]; then
              printf '%s (%s bytes)\n' "$f" "$s"
            fi
          done)
          if [ -n "$big" ]; then
            echo "::error::tracked files over 2 MiB:"
            echo "$big"
            exit 1
          fi
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::run gofmt on these files:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - name: Check stored elements and goroutine captures
        run: go tool mygo vet .
      # The dev build's local mail servers and seeded account must never
      # reach a release: not by default, and not when GOFLAGS adds e2e to
      # what mygo build compiles, which always carries mygo_nodownload.
      - name: Check release builds leave out the dev seed
        run: |
          for tags in "" "e2e,mygo_nodownload,mygo_noinspector" "e2e,mygo_nodownload"; do
            if go list -deps -tags "$tags" ./cmd/shu | grep -qx 'shu/internal/fakemail'; then
              echo "::error::a build with tags '$tags' links shu/internal/fakemail"
              exit 1
            fi
          done
          go list -deps -tags e2e ./cmd/shu | grep -qx 'shu/internal/fakemail' || {
            echo "::error::the e2e dev build no longer links the seed; fix this check"
            exit 1
          }
      # SHU_REQUIRE_SQLITE turns sqlitetest.Require's skip into a failure,
      # so the store, draft and watcher suites cannot pass without running.
      - name: Test
        env:
          CGO_ENABLED: "0"
          SHU_REQUIRE_SQLITE: "1"
        run: go test ./...

  # The local tool providers launch a process, and Windows does that
  # differently: a batch file, its own extensions and its own way of
  # killing a tree. That test file cannot run elsewhere, so the suite runs
  # once here as well.
  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test
        env:
          CGO_ENABLED: "0"
          SHU_REQUIRE_SQLITE: "1"
        run: go test ./...

  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest }
          - { name: Linux, os: ubuntu-latest }
          - { name: Windows, os: windows-latest }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # A smoke build for this runner's platform: no disk image, installer,
      # signing or upload, only proof that the app compiles and packages.
      - name: Build the app
        run: go tool mygo build -skip-dmg -skip-installer
      # mygo build regenerates the locale accessors; a diff means a change
      # edited the catalogs without committing the generated code.
      # Linux only, so Windows line-ending conversion cannot cause a diff.
      - name: Check generated files are committed
        if: runner.os == 'Linux'
        run: git diff --exit-code
