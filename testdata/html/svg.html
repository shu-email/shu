<!-- SVG can carry script and links of its own: the whole foreign
     subtree goes, and what the message says around it stays. -->
<html><body>
<!-- keep: Art follows -->
<!-- drop: <svg -->
<!-- drop: alert(1) -->
<!-- drop: xlink -->
<p>Art follows</p>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" onload="steal()">
  <script>alert(1)</script>
  <a xlink:href="javascript:alert(1)"><circle r="5"></circle></a>
  <image xlink:href="https://tracker.example/pixel.svg" width="1" height="1"></image>
</svg>
</body></html>
